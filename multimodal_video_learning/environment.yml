name: multimodal-video
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  # Python版本
  - python=3.10
  
  # PyTorch (根据需要选择)
  - pytorch::pytorch::*=*_0
  - pytorch::pytorch-cuda=11.8
  - pytorch::torchvision
  - pytorch::torchaudio
  
  # 科学计算
  - numpy>=1.24.0
  - scipy>=1.11.0
  - scikit-learn>=1.3.0
  - pandas>=2.0.0
  
  # 音频处理
  - librosa>=0.10.0
  
  # 图像处理
  - opencv=4.8.0
  - pillow>=10.0.0
  
  # 工具
  - pyyaml>=6.0
  - tqdm>=4.66.0
  - pip>=23.0
  
  # pip依赖
  - pip
  
  # pip在conda中的包
  - pip:
    - transformers>=4.30.0
    - tensorboard>=2.13.0
    - torch-summary
    - wandb>=0.15.0
    - pytorch-lightning>=2.0.0

